name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute cache keys
        id: keys
        run: |
          echo "idf=$(git ls-tree --object-only HEAD esp-idf)" >> "$GITHUB_OUTPUT"
          echo "py=$(python3 -V | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # ESP-IDF checkout (worktree + git objects) and its installed tools
      # (~/.espressif: xtensa toolchain, python venv). Keyed on the pinned
      # submodule commit, so bumping the submodule rebuilds the cache; the
      # python version is in the key because the venv breaks if the runner
      # image upgrades python.
      - name: Cache ESP-IDF and tools
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: |
            esp-idf
            .git/modules/esp-idf
            ~/.espressif
          key: idf-${{ runner.os }}-${{ steps.keys.outputs.idf }}-${{ steps.keys.outputs.py }}

      - name: Fetch ESP-IDF and install toolchain
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          ./esp-idf/install.sh esp32s3

      # Compiler cache: makes the compile step itself fast on repeat builds.
      # Key on the commit so every run saves; restore-keys picks the newest.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache

      - name: Build
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: /home/runner/.ccache
        run: |
          . ./esp-idf/export.sh
          idf.py build
          ccache -s

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: dashkit-firmware-${{ github.sha }}
          path: build/dashkit-firmware.bin
          retention-days: 14

      # Artifacts download as a zip behind a GitHub sign-in; a release asset
      # is a plain .bin a phone can fetch and flash via DashPilot's "Install
      # firmware from file". Never touches the OTA manifest. One rolling
      # pre-release per PR (test-pr-<n>) or for manual runs (test-build).
      # Fork PRs get a read-only token, so they skip this.
      - name: Publish test pre-release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || 'test-build' }}"
          target_commitish: "${{ github.event.pull_request.head.sha || github.sha }}"
          name: "${{ github.event_name == 'pull_request' && format('Test build: PR #{0}', github.event.pull_request.number) || format('Test build: {0}', github.ref_name) }}"
          body: |
            Firmware test build of ${{ github.event.pull_request.head.sha || github.sha }} (${{ github.ref_name }}). Not an OTA release.
            Flash it from DashPilot: Settings > Firmware > Install firmware from file.
          prerelease: true
          make_latest: false
          files: build/dashkit-firmware.bin
          fail_on_unmatched_files: true

  # Host-side Tesla crypto/session unit tests. No ESP-IDF needed:
  # the runner builds a pinned mbedTLS 3.6.2 into a local prefix.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache mbedTLS host build
        uses: actions/cache@v4
        with:
          path: build/tesla-host-test
          key: mbedtls-host-${{ runner.os }}-3.6.2

      - name: Install protobuf toolchain (proto-sync check)
        # Pinned: the committed bindings were regenerated with nanopb 0.4.9.1.
        # Newer nanopb releases can shift emitted formatting/descriptors, which
        # would fail the regen-drift check below as phantom drift. Bump this
        # pin only together with a full tools/gen_proto.py regeneration.
        run: pip install nanopb==0.4.9.1 grpcio-tools

      - name: Verify vendored Tesla protos + generated bindings are in sync
        run: bash tools/check_proto_sync.sh

      - name: Run Tesla crypto known-answer tests
        run: bash tools/test/run_tesla_crypto_test.sh

      - name: Run Tesla session/protocol round-trip tests (handshake/command/response)
        run: bash tools/test/run_tesla_session_test.sh

      - name: Run Tesla enrollment tests (keygen + present-key message)
        run: bash tools/test/run_tesla_enrollment_test.sh
